version: "3"
services:
  app:
    build: .
    container_name: App_Service
    ports:
      - 8005:8005
      - 5050:5050
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8005
    working_dir: /src
    networks:
      - shared_network
    restart: always

networks:
  shared_network:
    external:
      name: shared_network