version: "3"
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Web_Service
    ports:
      - 8005:8005
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8005
    networks:
      - shared_network
    restart: always

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: Server_Service
    ports:
      - 5050:5050
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - shared_network
    restart: always

networks:
  shared_network:
    external:
      name: shared_network
